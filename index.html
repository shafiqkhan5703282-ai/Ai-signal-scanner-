<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Signal Scanner</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.wrap{
  max-width:1000px;
  margin:auto;
  padding:18px;
}
.card{
  background:#0d1b2d;
  border:1px solid #1d3550;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
h1{
  margin:0 0 6px;
  font-size:26px;
}
.sub{
  color:#91a4ba;
  font-size:13px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
label{
  display:block;
  font-size:12px;
  color:#91a4ba;
  margin-bottom:6px;
}
select,button{
  width:100%;
  border:1px solid #29445f;
  background:#101f32;
  color:#fff;
  padding:12px;
  border-radius:10px;
  font-size:14px;
}
button{
  cursor:pointer;
  font-weight:bold;
}
button:hover{
  background:#17304a;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.signal{
  text-align:center;
  padding:28px 10px;
}
.orb{
  width:145px;
  height:145px;
  border-radius:50%;
  margin:10px auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  border:4px solid #29445f;
  background:#102238;
}
.orb.up{
  border-color:#16d98b;
  box-shadow:0 0 30px rgba(22,217,139,.3);
}
.orb.down{
  border-color:#ff5b70;
  box-shadow:0 0 30px rgba(255,91,112,.3);
}
.orb.wait{
  border-color:#f0b429;
  box-shadow:0 0 30px rgba(240,180,41,.2);
}
.info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.metric{
  background:#091626;
  border:1px solid #1d3550;
  padding:12px;
  border-radius:10px;
  text-align:center;
}
.metric small{
  display:block;
  color:#91a4ba;
  margin-bottom:5px;
}
.metric b{
  font-size:16px;
}
.status{
  text-align:center;
  color:#91a4ba;
  margin-top:10px;
}
.history{
  max-height:330px;
  overflow:auto;
}
.row{
  display:grid;
  grid-template-columns:1.2fr .8fr .8fr .8fr 1fr;
  gap:6px;
  padding:10px 4px;
  border-bottom:1px solid #1a3047;
  font-size:13px;
}
.green{color:#16d98b}
.red{color:#ff5b70}
.yellow{color:#f0b429}
@media(max-width:700px){
  .grid{grid-template-columns:1fr 1fr}
  .info{grid-template-columns:1fr 1fr}
  .actions{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>AI Signal Scanner</h1>
    <div class="sub">
      Multi-confirmation signal engine • Demo/analysis mode
    </div>
  </div>

  <div class="card">

    <div class="grid">

      <div>
        <label>Platform</label>
        <select id="platform">
          <option>Pocket Option</option>
          <option>Quotex</option>
        </select>
      </div>

      <div>
        <label>Pair</label>
        <select id="pair">

          <optgroup label="Major">
            <option>EUR/USD</option>
            <option>GBP/USD</option>
            <option>USD/JPY</option>
            <option>USD/CHF</option>
            <option>AUD/USD</option>
            <option>USD/CAD</option>
            <option>NZD/USD</option>
          </optgroup>

          <optgroup label="Cross">
            <option>EUR/GBP</option>
            <option>EUR/JPY</option>
            <option>GBP/JPY</option>
            <option>EUR/CHF</option>
            <option>GBP/CHF</option>
            <option>AUD/JPY</option>
            <option>CAD/JPY</option>
            <option>CHF/JPY</option>
            <option>NZD/JPY</option>
            <option>AUD/CAD</option>
            <option>AUD/CHF</option>
            <option>AUD/NZD</option>
            <option>CAD/CHF</option>
            <option>EUR/AUD</option>
            <option>EUR/CAD</option>
            <option>EUR/NZD</option>
            <option>GBP/AUD</option>
            <option>GBP/CAD</option>
            <option>GBP/NZD</option>
          </optgroup>

          <optgroup label="OTC">
            <option>EUR/USD (OTC)</option>
            <option>GBP/USD (OTC)</option>
            <option>USD/JPY (OTC)</option>
            <option>USD/CHF (OTC)</option>
            <option>AUD/USD (OTC)</option>
            <option>USD/CAD (OTC)</option>
            <option>NZD/USD (OTC)</option>
            <option>EUR/GBP (OTC)</option>
            <option>EUR/JPY (OTC)</option>
            <option>GBP/JPY (OTC)</option>
            <option>EUR/CHF (OTC)</option>
            <option>GBP/CHF (OTC)</option>
            <option>AUD/JPY (OTC)</option>
            <option>USD/ARS (OTC)</option>
            <option>USD/BRL (OTC)</option>
            <option>USD/INR (OTC)</option>
            <option>USD/MXN (OTC)</option>
            <option>USD/PKR (OTC)</option>
            <option>USD/BDT (OTC)</option>
            <option>USD/TRY (OTC)</option>
          </optgroup>

        </select>
      </div>

      <div>
        <label>Timeframe</label>
        <select id="expiry">
          <option value="3">3 sec</option>
          <option value="5">5 sec</option>
          <option value="10">10 sec</option>
          <option value="15">15 sec</option>
          <option value="30">30 sec</option>
          <option value="60">1 min</option>
          <option value="120">2 min</option>
          <option value="300" selected>5 min</option>
          <option value="900">15 min</option>
          <option value="1800">30 min</option>
          <option value="3600">1 hour</option>
        </select>
      </div>

      <div>
        <label>Signal Filter</label>
        <select id="filter">
          <option value="70">70% minimum</option>
          <option value="75" selected>75% minimum</option>
          <option value="80">80% minimum</option>
          <option value="85">85% minimum</option>
          <option value="90">90% minimum</option>
        </select>
      </div>

    </div>

    <div class="actions">
      <button id="scanBtn">SCAN SIGNAL</button>
      <button id="startBtn">AUTO SCAN</button>
      <button id="stopBtn">STOP</button>
    </div>

  </div>

  <div class="card signal">

    <div id="orb" class="orb wait">WAIT</div>

    <h2 id="signalText">Waiting for analysis</h2>

    <div class="sub" id="platformText">
      Select your market and scan
    </div>

    <div class="status" id="countdown">
      Ready
    </div>

  </div>

  <div class="card">

    <div class="info">

      <div class="metric">
        <small>Confidence</small>
        <b id="confidence">--</b>
      </div>

      <div class="metric">
        <small>RSI</small>
        <b id="rsi">--</b>
      </div>

      <div class="metric">
        <small>Trend</small>
        <b id="trend">--</b>
      </div>

      <div class="metric">
        <small>Momentum</small>
        <b id="momentum">--</b>
      </div>

    </div>

  </div>

  <div class="card">

    <h3>Signal History</h3>

    <div class="row">
      <b>Pair</b>
      <b>Signal</b>
      <b>Confidence</b>
      <b>Time</b>
      <b>Status</b>
    </div>

    <div id="history" class="history"></div>

  </div>

</div>

<script>

const $ = id => document.getElementById(id);

let running = false;
let timer = null;
let countdownTimer = null;

let candles = [];
let history = [];

const pair = $("pair");
const platform = $("platform");
const expiry = $("expiry");
const filter = $("filter");

const orb = $("orb");
const signalText = $("signalText");
const confidenceEl = $("confidence");
const rsiEl = $("rsi");
const trendEl = $("trend");
const momentumEl = $("momentum");
const countdownEl = $("countdown");
const platformText = $("platformText");
const historyEl = $("history");

function randomBetween(min,max){
  return Math.random()*(max-min)+min;
}

function seedMarket(){

  candles=[];

  let price=100+Math.random()*10;

  for(let i=0;i<120;i++){

    const open=price;

    const movement=randomBetween(-0.8,0.8);

    const close=open+movement;

    const high=Math.max(open,close)+Math.random()*0.35;

    const low=Math.min(open,close)-Math.random()*0.35;

    candles.push({
      open,
      high,
      low,
      close
    });

    price=close;
  }
}

function updateMarket(){

  if(!candles.length){
    seedMarket();
    return;
  }

  const last=candles[candles.length-1];

  const open=last.close;

  const movement=randomBetween(-0.8,0.8);

  const close=open+movement;

  candles.push({
    open,
    high:Math.max(open,close)+Math.random()*0.25,
    low:Math.min(open,close)-Math.random()*0.25,
    close
  });

  if(candles.length>150){
    candles.shift();
  }
}

function closes(){

  return candles.map(c=>c.close);

}

function ema(values,period){

  if(values.length<period) return values[values.length-1];

  const k=2/(period+1);

  let result=values[0];

  for(let i=1;i<values.length;i++){
    result=values[i]*k+result*(1-k);
  }

  return result;
}

function calculateRSI(values,period=14){

  if(values.length<period+1) return 50;

  let gains=0;
  let losses=0;

  for(let i=values.length-period;i<values.length;i++){

    const change=values[i]-values[i-1];

    if(change>0) gains+=change;
    else losses+=Math.abs(change);

  }

  if(losses===0) return 100;

  const rs=gains/losses;

  return 100-(100/(1+rs));
}

function macd(values){

  const e12=ema(values,12);
  const e26=ema(values,26);

  return e12-e26;
}

function calculateATR(){

  if(candles.length<15) return 0;

  let total=0;

  for(let i=candles.length-14;i<candles.length;i++){

    const c=candles[i];

    total+=c.high-c.low;
  }

  return total/14;
}

function analyze(){

  if(candles.length<40){
    seedMarket();
  }

  const values=closes();

  const e9=ema(values,9);
  const e21=ema(values,21);
  const e50=ema(values,50);

  const current=values[values.length-1];

  const rsi=calculateRSI(values,14);

  const macdValue=macd(values);

  const previous=values[values.length-6];

  const momentum=current-previous;

  const atr=calculateATR();

  let up=0;
  let down=0;

  /*
    TREND
  */

  if(current>e9) up+=15;
  else down+=15;

  if(e9>e21) up+=15;
  else down+=15;

  if(e21>e50) up+=10;
  else down+=10;

  /*
    RSI
  */

  if(rsi>=52 && rsi<=68) up+=15;

  if(rsi<=48 && rsi>=32) down+=15;

  /*
    MACD
  */

  if(macdValue>0) up+=15;
  else down+=15;

  /*
    MOMENTUM
  */

  if(momentum>0) up+=15;
  else if(momentum<0) down+=15;

  /*
    CANDLE PRESSURE
  */

  const last=candles[candles.length-1];

  const body=last.close-last.open;

  if(body>0) up+=10;
  else if(body<0) down+=10;

  /*
    SUPPORT / RESISTANCE
  */

  const recent=values.slice(-20);

  const highest=Math.max(...recent);
  const lowest=Math.min(...recent);

  const range=highest-lowest;

  let nearResistance=false;
  let nearSupport=false;

  if(range>0){

    nearResistance=(highest-current)/range<0.08;

    nearSupport=(current-lowest)/range<0.08;
  }

  /*
    Avoid buying directly into resistance
    or selling directly into support.
  */

  if(nearResistance) up-=12;

  if(nearSupport) down-=12;

  /*
    Volatility filter
  */

  if(atr<=0){
    return {
      signal:"WAIT",
      confidence:0,
      rsi,
      trend:"UNKNOWN",
      momentum,
      reason:"Insufficient market data"
    };
  }

  let signal="WAIT";

  const best=Math.max(up,down);

  let confidence=Math.round(
    Math.min(99,(best/100)*100)
  );

  const minimum=Number(filter.value);

  /*
    Require strong agreement.
  */

  if(up>down && up-down>=15 && confidence>=minimum){

    signal="UP";

  }else if(down>up && down-up>=15 && confidence>=minimum){

    signal="DOWN";

  }else{

    signal="WAIT";

  }

  let trend="SIDEWAYS";

  if(e9>e21 && e21>e50){
    trend="UPTREND";
  }else if(e9<e21 && e21<e50){
    trend="DOWNTREND";
  }

  let momentumText="NEUTRAL";

  if(momentum>0) momentumText="BULLISH";
  if(momentum<0) momentumText="BEARISH";

  return {
    signal,
    confidence,
    rsi,
    trend,
    momentum:momentumText,
    reason:
      signal==="WAIT"
      ? "Indicators are not sufficiently aligned"
      : "Multiple confirmations aligned"
  };
}

function showResult(result){

  orb.className="orb";

  if(result.signal==="UP"){

    orb.classList.add("up");
    orb.textContent="UP";

    signalText.textContent="CALL / UP";
    signalText.className="green";

  }else if(result.signal==="DOWN"){

    orb.classList.add("down");
    orb.textContent="DOWN";

    signalText.textContent="PUT / DOWN";
    signalText.className="red";

  }else{

    orb.classList.add("wait");
    orb.textContent="WAIT";

    signalText.textContent="NO TRADE";
    signalText.className="yellow";
  }

  confidenceEl.textContent=result.confidence+"%";

  rsiEl.textContent=result.rsi.toFixed(1);

  trendEl.textContent=result.trend;

  momentumEl.textContent=result.momentum;

  platformText.textContent=
    platform.value+
    " • "+
    pair.value+
    " • "+
    result.reason;
}

function scan(){

  updateMarket();

  const result=analyze();

  showResult(result);

  if(result.signal!=="WAIT"){

    addHistory(result);

  }

  return result;
}

function addHistory(result){

  history.unshift({

    pair:pair.value,

    signal:result.signal,

    confidence:result.confidence,

    time:new Date().toLocaleTimeString(),

    status:"PENDING"

  });

  if(history.length>50){
    history.pop();
  }

  renderHistory();
}

function renderHistory(){

  historyEl.innerHTML="";

  history.forEach((item,index)=>{

    const row=document.createElement("div");

    row.className="row";

    const signalClass=
      item.signal==="UP"
      ?"green"
      :"red";

    row.innerHTML=`

      <span>${item.pair}</span>

      <span class="${signalClass}">
        ${item.signal}
      </span>

      <span>${item.confidence}%</span>

      <span>${item.time}</span>

      <span>${item.status}</span>

    `;

    historyEl.appendChild(row);

  });
}

function start(){

  if(running) return;

  running=true;

  scan();

  timer=setInterval(()=>{

    scan();

  },5000);

  startCountdown();

}

function stop(){

  running=false;

  clearInterval(timer);
  clearInterval(countdownTimer);

  countdownEl.textContent="Stopped";

}

function startCountdown(){

  clearInterval(countdownTimer);

  let seconds=5;

  countdownEl.textContent=
    "Next scan in "+seconds+"s";

  countdownTimer=setInterval(()=>{

    seconds--;

    if(seconds<=0){
      seconds=5;
    }

    countdownEl.textContent=
      "Next scan in "+seconds+"s";

  },1000);
}

$("scanBtn").addEventListener("click",()=>{

  scan();

});

$("startBtn").addEventListener("click",()=>{

  start();

});

$("stopBtn").addEventListener("click",()=>{

  stop();

});

platform.addEventListener("change",()=>{

  platformText.textContent=
    platform.value+
    " • "+
    pair.value;

});

pair.addEventListener("change",()=>{

  seedMarket();

  platformText.textContent=
    platform.value+
    " • "+
    pair.value;

});

expiry.addEventListener("change",()=>{

  countdownEl.textContent=
    "Timeframe: "+
    expiry.options[expiry.selectedIndex].text;

});

filter.addEventListener("change",()=>{

  scan();

});

seedMarket();

renderHistory();

</script>

</body>
</html>
