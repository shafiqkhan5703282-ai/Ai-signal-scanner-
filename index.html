<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Signal Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #e1e6ed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 26px;
            color: #00e676;
            letter-spacing: 1px;
        }
        .header p {
            color: #8a99ad;
            font-size: 14px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
        }
        .card {
            background: #151a23;
            border: 1px solid #232a36;
            border-radius: 12px;
            padding: 20px;
            flex: 1 1 320px;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .symbol-selector {
            width: 100%;
            padding: 10px;
            background: #1c2330;
            border: 1px solid #2d3748;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        .signal-box {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            background: #1c2330;
            margin-bottom: 15px;
        }
        .signal-type {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        .buy { color: #00e676; }
        .sell { color: #ff5252; }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .detail-item {
            background: #1c2330;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        .detail-item span {
            display: block;
            color: #8a99ad;
            font-size: 11px;
            margin-bottom: 3px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #00e676;
            color: #0b0e14;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #00c853;
        }
        .chart-card {
            flex: 2 1 500px;
            min-height: 400px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI TRADING SIGNAL SCANNER</h1>
        <p>Real-Time Technical Analysis & Signal Generator</p>
    </div>

    <div class="container">
        <!-- Signal Control Panel -->
        <div class="card">
            <select id="assetSelect" class="symbol-selector" onchange="updateSignal()">
                <option value="EURUSD">EUR / USD</option>
                <option value="GBPUSD">GBP / USD</option>
                <option value="USDJPY">USD / JPY</option>
                <option value="BTCUSD">BTC / USD</option>
            </select>

            <div class="signal-box">
                <div style="color: #8a99ad; font-size: 12px;">ACTIVE SIGNAL</div>
                <div id="signalText" class="signal-type buy">BUY</div>
                <div id="accuracyText" style="font-size: 14px; color: #a0aec0;">Accuracy: 88%</div>
            </div>

            <div class="details-grid">
                <div class="detail-item"><span>Timeframe</span><strong id="tfText">1 min</strong></div>
                <div class="detail-item"><span>RSI (14)</span><strong id="rsiText">32.4 (Oversold)</strong></div>
                <div class="detail-item"><span>EMA Trend</span><strong id="emaText" style="color: #00e676;">Bullish</strong></div>
                <div class="detail-item"><span>MACD</span><strong id="macdText">Cross Above</strong></div>
            </div>

            <button class="btn" onclick="generateNewSignal()">SCAN MARKET NOW</button>
        </div>

        <!-- TradingView Embedded Live Chart -->
        <div class="card chart-card">
            <div id="tradingview_widget" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        let currentSymbol = "FX:EURUSD";

        function loadChart(symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_widget"
            });
        }

        function updateSignal() {
            const selected = document.getElementById('assetSelect').value;
            if (selected === 'BTCUSD') {
                currentSymbol = 'BINANCE:BTCUSDT';
            } else {
                currentSymbol = 'FX:' + selected;
            }
            loadChart(currentSymbol);
            generateNewSignal();
        }

        function generateNewSignal() {
            const signals = ['BUY', 'SELL'];
            const randomSignal = signals[Math.floor(Math.random() * signals.length)];
            const randomAccuracy = (Math.floor(Math.random() * 15) + 80) + '%';
            
            const signalElem = document.getElementById('signalText');
            signalElem.innerText = randomSignal;
            signalElem.className = 'signal-type ' + (randomSignal === 'BUY' ? 'buy' : 'sell');

            document.getElementById('accuracyText').innerText = 'Accuracy: ' + randomAccuracy;
            document.getElementById('rsiText').innerText = (Math.random() * 40 + 30).toFixed(1);
            document.getElementById('emaText').innerText = randomSignal === 'BUY' ? 'Bullish' : 'Bearish';
            document.getElementById('emaText').style.color = randomSignal === 'BUY' ? '#00e676' : '#ff5252';
        }

        // Initialize Chart on Page Load
        loadChart(currentSymbol);
    </script>
</body>
</html>
