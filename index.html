<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsii-74 Signal Scanner</title>
    <style>
        :root {
            --bg-dark: #2c221e;
            --panel-bg: #3d302b;
            --accent-orange: #ff8c00;
            --accent-orange-hover: #e07b00;
            --text-light: #f5f5f5;
            --text-muted: #b0a4a0;
            --call-green: #26a69a;
            --put-red: #ef5350;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: var(--accent-orange);
            letter-spacing: 1px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        select {
            background-color: #2c221e;
            color: var(--text-light);
            border: 1px solid #55443d;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent-orange);
        }

        .btn-action {
            background-color: var(--accent-orange);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .btn-action:hover {
            background-color: var(--accent-orange-hover);
        }

        .signal-board {
            background-color: #2c221e;
            border: 1px solid #55443d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .status-wait { background-color: #555; color: #fff; }
        .status-call { background-color: var(--call-green); color: #fff; }
        .status-put { background-color: var(--put-red); color: #fff; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid #4a3a34;
            padding-top: 15px;
        }

        .metric-item {
            font-size: 13px;
            color: var(--text-muted);
        }

        .metric-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-light);
            margin-top: 4px;
        }

        .connection-status {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ARSII-74 SCANNER</h1>

        <div class="controls-grid">
            <div class="control-group">
                <label for="asset-select">Asset Pair</label>
                <select id="asset-select">
                    <option value="EUR/USD">EUR/USD (OTC)</option>
                    <option value="GBP/USD">GBP/USD (OTC)</option>
                    <option value="AUD/USD">AUD/USD (OTC)</option>
                    <option value="USD/JPY">USD/JPY (OTC)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="timeframe-select">Timeframe</label>
                <select id="timeframe-select">
                    <option value="5S">5 Seconds</option>
                    <option value="15S">15 Seconds</option>
                    <option value="30S">30 Seconds</option>
                    <option value="1M" selected>1 Minute</option>
                    <option value="5M">5 Minutes</option>
                </select>
            </div>
        </div>

        <button class="btn-action" onclick="toggleScanner()">Start Scanner Engine</button>

        <div class="signal-board">
            <div id="status-badge" class="status-badge status-wait">WAITING FOR SIGNAL</div>
            <div>Asset: <span id="display-asset" style="font-weight: bold;">EUR/USD</span></div>
            
            <div class="metrics-grid">
                <div class="metric-item">
                    Price
                    <div id="val-price" class="metric-value">0.0000</div>
                </div>
                <div class="metric-item">
                    RSI (14)
                    <div id="val-rsi" class="metric-value">0.00</div>
                </div>
                <div class="metric-item">
                    EMA (9)
                    <div id="val-ema" class="metric-value">0.0000</div>
                </div>
            </div>
        </div>

        <div id="conn-status" class="connection-status">Status: Disconnected / Simulation Mode</div>
    </div>

    <script>
        let isRunning = false;
        let simulationInterval = null;

        // Web Audio API helper for sound alerts
        function playBeep(isCall) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = isCall ? 'sine' : 'square';
                osc.frequency.setValueAtTime(isCall ? 587.33 : 329.63, audioCtx.currentTime); // D5 for Call, E4 for Put

                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio blocked or not supported");
            }
        }

        function toggleScanner() {
            isRunning = !isRunning;
            const btn = document.querySelector('.btn-action');
            const connStatus = document.getElementById('conn-status');

            if (isRunning) {
                btn.textContent = "Stop Scanner Engine";
                btn.style.backgroundColor = "#d32f2f";
                connStatus.textContent = "Status: Live Simulation Active";
                
                // Start simulation loop (or swap this out with your WebSocket connection)
                simulationInterval = setInterval(runSimulationTick, 3000);
            } else {
                btn.textContent = "Start Scanner Engine";
                btn.style.backgroundColor = "var(--accent-orange)";
                connStatus.textContent = "Status: Stopped";
                clearInterval(simulationInterval);
                resetBoard();
            }
        }

        function runSimulationTick() {
            const selectedAsset = document.getElementById('asset-select').value;
            document.getElementById('display-asset').textContent = selectedAsset;

            // Generate mock metrics
            const randomPrice = (1.0500 + Math.random() * 0.0500).toFixed(4);
            const randomRsi = (Math.random() * 100).toFixed(2);
            const randomEma = (1.0500 + Math.random() * 0.0490).toFixed(4);

            let action = "WAIT";
            let badgeClass = "status-wait";
            let badgeText = "WAIT / ANALYZING";

            if (randomRsi < 35) {
                action = "CALL";
                badgeClass = "status-call";
                badgeText = "CALL (BUY)";
                playBeep(true);
            } else if (randomRsi > 65) {
                action = "PUT";
                badgeClass = "status-put";
                badgeText = "PUT (SELL)";
                playBeep(false);
            }

            // Update DOM elements
            const badge = document.getElementById('status-badge');
            badge.className = `status-badge ${badgeClass}`;
            badge.textContent = badgeText;

            document.getElementById('val-price').textContent = randomPrice;
            document.getElementById('val-rsi').textContent = randomRsi;
            document.getElementById('val-ema').textContent = randomEma;
        }

        function resetBoard() {
            const badge = document.getElementById('status-badge');
            badge.className = "status-badge status-wait";
            badge.textContent = "WAITING FOR SIGNAL";
            document.getElementById('val-price').textContent = "0.0000";
            document.getElementById('val-rsi').textContent = "0.00";
            document.getElementById('val-ema').textContent = "0.0000";
        }

        /* 
           If connecting to your FastAPI WebSocket backend instead of simulation, replace runSimulationTick with:
           const ws = new WebSocket("ws://localhost:8000/ws/signals");
           ws.onmessage = function(event) {
               const data = JSON.parse(event.data);
               // update DOM elements here...
           };
        */
    </script>
</body>
</html>
