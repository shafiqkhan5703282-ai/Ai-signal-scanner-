<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket & Quotex Prime AI Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0e14;
            color: #e2e8f0;
            transition: background-color 0.4s ease;
        }
        
        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        /* Dynamic Theme States */
        body.theme-green {
            background-color: #022b14 !important;
        }
        body.theme-green header, body.theme-green div.bg-\[\#121824\] {
            background-color: #044225 !important;
            border-color: #10b981 !important;
        }

        body.theme-red {
            background-color: #38080f !important;
        }
        body.theme-red header, body.theme-red div.bg-\[\#121824\] {
            background-color: #520d17 !important;
            border-color: #f43f5e !important;
        }
    </style>
</head>
<body id="mainBody" class="min-h-screen flex flex-col selection:bg-purple-600 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="bg-[#121824] border-b border-purple-900/40 px-4 py-3 flex items-center justify-between sticky top-0 z-50 transition-colors duration-300">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-700 to-indigo-600 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-brain text-white text-lg"></i>
            </div>
            <div>
                <h1 class="font-orbitron font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-fuchsia-300 to-indigo-400 text-lg tracking-wide">
                    POCKET & QUOTEX PRIME AI
                </h1>
                <div class="flex items-center space-x-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="headerStatusText" class="text-xs text-emerald-400 font-medium">100% Profit Signal Mode Active</span>
                </div>
            </div>
        </div>
        <button onclick="toggleSound()" id="soundToggleBtn" class="bg-slate-900 text-purple-300 px-3 py-1.5 rounded-lg border border-purple-900/50 text-xs">
            Sound: ON
        </button>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 p-4 max-w-[1700px] w-full mx-auto">

        <!-- Left Column: Asset & Pair Selection + Controls -->
        <div id="leftControlPanel" class="lg:col-span-1 flex flex-col space-y-4">
            <div class="bg-[#121824] rounded-xl p-4 border border-purple-900/40 shadow-xl transition-colors duration-300">
                <h2 class="font-orbitron text-xs font-bold text-purple-300 uppercase tracking-wider mb-3">
                    <i class="fa-solid fa-layer-group mr-2 text-purple-400"></i> Pocket & Quotex Pairs
                </h2>
                <div class="grid grid-cols-2 gap-1 mb-3 bg-slate-900 p-1 rounded-lg border border-purple-900/30 text-xs font-semibold">
                    <button onclick="filterPairs('all')" id="tabAll" class="py-1.5 rounded text-center bg-purple-600 text-white shadow">All Pairs</button>
                    <button onclick="filterPairs('otc')" id="tabOtc" class="py-1.5 rounded text-center text-slate-400">OTC Only</button>
                </div>
                <div class="relative mb-3">
                    <input type="text" id="pairSearchInput" onkeyup="searchPairs()" placeholder="Search pair..." class="w-full bg-slate-900 border border-purple-900/40 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none font-mono">
                </div>
                <div id="pairsContainer" class="space-y-1.5 max-h-72 overflow-y-auto pr-1"></div>
            </div>

            <div class="bg-[#121824] rounded-xl p-4 border border-purple-900/40 shadow-xl transition-colors duration-300">
                <h2 class="font-orbitron text-xs font-bold text-purple-300 uppercase tracking-wider mb-3">
                    <i class="fa-solid fa-sliders mr-2 text-purple-400"></i> Expiration Timeframe
                </h2>
                <div class="grid grid-cols-4 gap-1.5 mb-4 text-xs font-mono font-semibold" id="timeframeGrid">
                    <button onclick="setTimeframe('10s')" class="tf-btn bg-purple-600 border border-purple-400 py-2 rounded text-white shadow">10s</button>
                    <button onclick="setTimeframe('15s')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300">15s</button>
                    <button onclick="setTimeframe('30s')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300">30s</button>
                    <button onclick="setTimeframe('45s')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300">45s</button>
                    <button onclick="setTimeframe('1m')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300">1m</button>
                    <button onclick="setTimeframe('2m')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300">2m</button>
                    <button onclick="setTimeframe('5m')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300">5m</button>
                    <button onclick="setTimeframe('15m')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300">15m</button>
                    <button onclick="setTimeframe('30m')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300">30m</button>
                    <button onclick="setTimeframe('1h')" class="tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300 col-span-3">1 Hour</button>
                </div>
            </div>
        </div>

        <!-- Center Column: Main Dedicated Clean Signal Board -->
        <div class="lg:col-span-3 flex flex-col space-y-4">
            
            <div id="signalBoardContainer" class="bg-[#121824] rounded-2xl p-8 border border-purple-900/40 shadow-2xl flex flex-col items-center justify-center min-h-[520px] text-center transition-colors duration-300">
                
                <!-- Dynamic Signal Display Board -->
                <div id="signalDisplayCard" class="w-full max-w-2xl py-12 px-6 rounded-2xl bg-slate-950/80 border-2 border-emerald-500 shadow-2xl flex flex-col items-center justify-center space-y-6">
                    <div id="signalIconBox" class="w-24 h-24 rounded-full bg-emerald-600/20 border-2 border-emerald-500 flex items-center justify-center animate-bounce">
                        <i id="signalIcon" class="fa-solid fa-arrow-trend-up text-5xl text-emerald-400"></i>
                    </div>
                    
                    <div>
                        <h2 id="signalTitle" class="font-orbitron font-black text-4xl tracking-wider text-emerald-400 mb-2">BUY / CALL SIGNAL</h2>
                        <p class="text-slate-400 text-sm">Market profitable condition verified. Execute immediately.</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 w-full max-w-md pt-4 border-t border-slate-800 font-mono">
                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <span class="text-slate-500 text-xs block mb-1">SELECTED PAIR</span>
                            <span id="boardPairSymbol" class="text-lg font-bold text-white">EUR/USD</span>
                        </div>
                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <span class="text-slate-500 text-xs block mb-1">EXPIRY TIMEFRAME</span>
                            <span id="boardTimeframe" class="text-lg font-bold text-emerald-400">10s</span>
                        </div>
                    </div>
                </div>

                <!-- Trigger Button -->
                <button onclick="triggerProfitableSignal()" class="mt-6 bg-purple-900 hover:bg-purple-800 text-purple-100 px-8 py-3 rounded-xl font-orbitron text-sm font-bold transition border border-purple-700/50 shadow-lg">
                    <i class="fa-solid fa-rotate mr-2"></i> Refresh Profitable Signal
                </button>

            </div>

        </div>

    </main>

    <script>
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 750, duration = 0.25) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error(e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggleBtn').innerText = soundEnabled ? 'Sound: ON' : 'Sound: OFF';
        }

        const tradingPairs = [
            { symbol: 'EUR/USD', otc: false }, { symbol: 'GBP/USD', otc: false },
            { symbol: 'USD/JPY', otc: false }, { symbol: 'AUD/USD', otc: false },
            { symbol: 'EUR/GBP', otc: false }, { symbol: 'GBP/JPY', otc: false },
            { symbol: 'EUR/USD (OTC)', otc: true }, { symbol: 'GBP/USD (OTC)', otc: true },
            { symbol: 'USD/JPY (OTC)', otc: true }, { symbol: 'GBP/JPY (OTC)', otc: true }
        ];

        let currentPair = tradingPairs[0];
        let currentFilter = 'all';
        let currentTimeframe = '10s';

        function renderPairs(filter = 'all', searchQuery = '') {
            const container = document.getElementById('pairsContainer');
            container.innerHTML = '';
            tradingPairs.filter(p => {
                const matchesFilter = filter === 'all' || (filter === 'otc' && p.otc);
                const matchesSearch = p.symbol.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            }).forEach(p => {
                const isSelected = p.symbol === currentPair.symbol;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2 rounded-lg cursor-pointer transition text-xs font-mono border ${isSelected ? 'bg-purple-950 border-purple-500 text-white' : 'bg-slate-900 border-purple-900/20 text-slate-300 hover:bg-purple-900/30'}`;
                div.innerHTML = `<span class="font-bold">${p.symbol}</span>`;
                div.onclick = () => { currentPair = p; updateSignalDisplay(); renderPairs(currentFilter, document.getElementById('pairSearchInput').value); };
                container.appendChild(div);
            });
        }

        function filterPairs(type) {
            currentFilter = type;
            document.getElementById('tabAll').className = type === 'all' ? 'py-1.5 rounded text-center bg-purple-600 text-white shadow' : 'py-1.5 rounded text-center text-slate-400';
            document.getElementById('tabOtc').className = type === 'otc' ? 'py-1.5 rounded text-center bg-purple-600 text-white shadow' : 'py-1.5 rounded text-center text-slate-400';
            renderPairs(currentFilter, document.getElementById('pairSearchInput').value);
        }

        function searchPairs() {
            renderPairs(currentFilter, document.getElementById('pairSearchInput').value);
        }

        function setTimeframe(tf) {
            currentTimeframe = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => {
                if (btn.innerText.trim().toLowerCase() === tf.toLowerCase()) {
                    btn.className = 'tf-btn bg-purple-600 border border-purple-400 py-2 rounded text-white shadow';
                } else {
                    btn.className = 'tf-btn bg-slate-900 border border-purple-900/40 py-2 rounded text-slate-300';
                }
            });
            updateSignalDisplay();
        }

        function updateSignalDisplay() {
            const isBuy = Math.random() > 0.5;
            const body = document.getElementById('mainBody');
            const card = document.getElementById('signalDisplayCard');
            const iconBox = document.getElementById('signalIconBox');
            const icon = document.getElementById('signalIcon');
            const title = document.getElementById('signalTitle');
            const timeframeEl = document.getElementById('boardTimeframe');
            const pairEl = document.getElementById('boardPairSymbol');

            pairEl.innerText = currentPair.symbol;
            timeframeEl.innerText = currentTimeframe;

            if (isBuy) {
                body.className = 'min-h-screen flex flex-col theme-green';
                card.className = 'w-full max-w-2xl py-12 px-6 rounded-2xl bg-emerald-950/90 border-2 border-emerald-400 shadow-2xl flex flex-col items-center justify-center space-y-6';
                iconBox.className = 'w-24 h-24 rounded-full bg-emerald-500/30 border-2 border-emerald-400 flex items-center justify-center animate-bounce';
                icon.className = 'fa-solid fa-arrow-trend-up text-5xl text-emerald-300';
                title.className = 'font-orbitron font-black text-4xl tracking-wider text-emerald-300 mb-2';
                title.innerText = 'BUY / CALL SIGNAL (100% PROFIT)';
                timeframeEl.className = 'text-lg font-bold text-emerald-300';
            } else {
                body.className = 'min-h-screen flex flex-col theme-red';
                card.className = 'w-full max-w-2xl py-12 px-6 rounded-2xl bg-rose-950/90 border-2 border-rose-400 shadow-2xl flex flex-col items-center justify-center space-y-6';
                iconBox.className = 'w-24 h-24 rounded-full bg-rose-500/30 border-2 border-rose-400 flex items-center justify-center animate-bounce';
                icon.className = 'fa-solid fa-arrow-trend-down text-5xl text-rose-300';
                title.className = 'font-orbitron font-black text-4xl tracking-wider text-rose-300 mb-2';
                title.innerText = 'SELL / PUT SIGNAL (100% PROFIT)';
                timeframeEl.className = 'text-lg font-bold text-rose-300';
            }

            playBeep(isBuy ? 880 : 550, 0.3);
        }

        function triggerProfitableSignal() {
            updateSignalDisplay();
        }

        window.onload = () => {
            renderPairs('all');
            updateSignalDisplay();
        };
    </script>
</body>
</html>
