<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chinese Signals - AI BOT PRO MAX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spinCircle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spinCircle 1.2s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-5">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center bg-slate-900 border border-slate-800 rounded-xl p-3.5">
      <div>
        <h1 class="text-lg font-extrabold text-cyan-400 tracking-wide">Chinese Signals</h1>
        <p class="text-[10px] font-semibold text-slate-400 tracking-wider">AI BOT | PRO MAX</p>
      </div>
      <span class="bg-amber-500/20 text-amber-300 text-[10px] px-3 py-1 rounded-full font-bold border border-amber-500/30">
        PRO MAX UNLOCKED
      </span>
    </div>

    <!-- Main Control Panel -->
    <div id="controlPanel" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Broker</label>
        <select id="brokerSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 mt-1 text-sm text-white focus:outline-none focus:border-cyan-400">
          <option value="Quotex">Quotex</option>
          <option value="Pocket Option">Pocket Option</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Market</label>
        <select id="marketSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 mt-1 text-sm text-white focus:outline-none focus:border-cyan-400">
          <option value="OTC Markets">OTC Markets</option>
          <option value="Live Currency Markets">Live Currency Markets</option>
          <option value="Crypto Markets">Crypto Markets</option>
          <option value="Commodities">Commodities</option>
          <option value="Indices & Stocks">Indices & Stocks</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pair</label>
        <select id="pairSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 mt-1 text-sm text-white focus:outline-none focus:border-cyan-400">
          <!-- Populated by JS -->
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Timer (3s to 1 Hour)</label>
        <select id="timerSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 mt-1 text-sm text-white focus:outline-none focus:border-cyan-400">
          <option value="3 Seconds">3 Seconds</option>
          <option value="5 Seconds" selected>5 Seconds</option>
          <option value="10 Seconds">10 Seconds</option>
          <option value="15 Seconds">15 Seconds</option>
          <option value="30 Seconds">30 Seconds</option>
          <option value="1 Minute">1 Minute</option>
          <option value="2 Minutes">2 Minutes</option>
          <option value="3 Minutes">3 Minutes</option>
          <option value="5 Minutes">5 Minutes</option>
          <option value="10 Minutes">10 Minutes</option>
          <option value="15 Minutes">15 Minutes</option>
          <option value="30 Minutes">30 Minutes</option>
          <option value="1 Hour">1 Hour</option>
        </select>
      </div>

      <button id="generateBtn" class="w-full mt-2 bg-blue-600 hover:bg-blue-500 font-extrabold text-sm py-3.5 rounded-xl transition-all shadow-lg shadow-blue-600/30 active:scale-98">
        ⚡ GENERATE SIGNAL
      </button>
    </div>

    <!-- Analyzing Animation View -->
    <div id="loadingView" class="hidden text-center py-10 space-y-4">
      <div class="w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin-custom mx-auto"></div>
      <div>
        <p class="text-sm font-bold text-slate-200 uppercase tracking-wider">Analyzing Market Data...</p>
        <p id="loadingMeta" class="text-xs text-slate-500 mt-1"></p>
      </div>
    </div>

    <!-- Result Signal View -->
    <div id="resultView" class="hidden space-y-4 text-center">
      <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-2">
        <span id="resPair">PAIR: USD/ARS (OTC)</span>
        <span id="resId">ID: #CSA2582</span>
      </div>

      <div id="resDirection" class="font-black text-4xl tracking-widest animate-pulse">
        DOWN
      </div>
      <p id="resType" class="text-xs font-extrabold tracking-wider">STRONG SELL SIGNAL</p>

      <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-800">
        <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
          <span class="text-slate-400 block text-[10px] uppercase">Broker</span>
          <span id="resBroker" class="font-bold text-white">Quotex</span>
        </div>
        <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
          <span class="text-slate-400 block text-[10px] uppercase">Timer</span>
          <span id="resTimer" class="font-bold text-white">5 Seconds</span>
        </div>
        <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
          <span class="text-slate-400 block text-[10px] uppercase">Accuracy</span>
          <span id="resAccuracy" class="font-bold text-emerald-400">98.1%</span>
        </div>
        <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
          <span class="text-slate-400 block text-[10px] uppercase">Signal Strength</span>
          <span id="resStrength" class="font-bold text-cyan-400">93.8%</span>
        </div>
      </div>

      <button id="resetBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-xs font-bold py-3 rounded-xl text-slate-300 transition-colors border border-slate-700">
        Generate New Signal
      </button>
    </div>

  </div>

  <script>
    const TRADING_PAIRS = {
      'OTC Markets': [
        'USD/ARS (OTC)', 'EUR/USD (OTC)', 'GBP/USD (OTC)', 'USD/JPY (OTC)', 
        'AUD/CAD (OTC)', 'AUD/CHF (OTC)', 'AUD/JPY (OTC)', 'CAD/CHF (OTC)', 
        'CAD/JPY (OTC)', 'CHF/JPY (OTC)', 'EUR/GBP (OTC)', 'EUR/JPY (OTC)', 
        'GBP/JPY (OTC)', 'USD/CAD (OTC)', 'USD/CHF (OTC)', 'USD/INR (OTC)', 
        'USD/BRL (OTC)', 'USD/PKR (OTC)', 'USD/EGP (OTC)', 'USD/BDT (OTC)'
      ],
      'Live Currency Markets': [
        'EUR/USD', 'GBP/USD', 'USD/JPY', 'USD/CHF', 'USD/CAD', 
        'AUD/USD', 'NZD/USD', 'EUR/GBP', 'EUR/JPY', 'GBP/JPY'
      ],
      'Crypto Markets': [
        'BTC/USD', 'ETH/USD', 'SOL/USD', 'XRP/USD', 'LTC/USD'
      ],
      'Commodities': [
        'USCRUDE (WTI)', 'UKBRENT (Brent)', 'XAU/USD (Gold)', 'XAG/USD (Silver)'
      ],
      'Indices & Stocks': [
        'US100 (Nasdaq)', 'SP500', 'DJI30', 'Apple OTC', 'Microsoft OTC', 'Tesla OTC'
      ]
    };

    const marketSelect = document.getElementById('marketSelect');
    const pairSelect = document.getElementById('pairSelect');
    const brokerSelect = document.getElementById('brokerSelect');
    const timerSelect = document.getElementById('timerSelect');

    const controlPanel = document.getElementById('controlPanel');
    const loadingView = document.getElementById('loadingView');
    const resultView = document.getElementById('resultView');
    const loadingMeta = document.getElementById('loadingMeta');

    function populatePairs() {
      const selectedMarket = marketSelect.value;
      const pairs = TRADING_PAIRS[selectedMarket] || [];
      pairSelect.innerHTML = pairs.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    marketSelect.addEventListener('change', populatePairs);
    populatePairs();

    document.getElementById('generateBtn').addEventListener('click', () => {
      const selectedPair = pairSelect.value;
      const selectedTimer = timerSelect.value;
      
      loadingMeta.textContent = `${selectedPair} • ${selectedTimer}`;
      controlPanel.classList.add('hidden');
      loadingView.classList.remove('hidden');

      setTimeout(() => {
        const isUp = Math.random() > 0.5;
        const accuracyVal = (88 + Math.random() * 10).toFixed(1) + '%';
        const strengthVal = (82 + Math.random() * 15).toFixed(1) + '%';
        const signalId = `#CSA${Math.floor(1000 + Math.random() * 9000)}`;

        document.getElementById('resPair').textContent = `PAIR: ${selectedPair}`;
        document.getElementById('resId').textContent = `ID: ${signalId}`;
        document.getElementById('resBroker').textContent = brokerSelect.value;
        document.getElementById('resTimer').textContent = selectedTimer;
        document.getElementById('resAccuracy').textContent = accuracyVal;
        document.getElementById('resStrength').textContent = strengthVal;

        const resDir = document.getElementById('resDirection');
        const resType = document.getElementById('resType');

        if (isUp) {
          resDir.textContent = '↑ UP';
          resDir.className = 'font-black text-4xl tracking-widest animate-pulse text-emerald-500';
          resType.textContent = 'STRONG BUY SIGNAL';
          resType.className = 'text-xs font-extrabold tracking-wider text-emerald-400';
        } else {
          resDir.textContent = '↓ DOWN';
          resDir.className = 'font-black text-4xl tracking-widest animate-pulse text-red-500';
          resType.textContent = 'STRONG SELL SIGNAL';
          resType.className = 'text-xs font-extrabold tracking-wider text-red-400';
        }

        loadingView.classList.add('hidden');
        resultView.classList.remove('hidden');
      }, 3000);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      resultView.classList.add('hidden');
      controlPanel.classList.remove('hidden');
    });
  </script>
</body>
</html>
