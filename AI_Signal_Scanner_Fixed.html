<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chinese Signals - AI BOT PRO MAX</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes spinCircle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animate-spin-custom {
      animation: spinCircle 1.2s linear infinite;
    }
  </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-3 font-sans">

  <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-700 to-purple-700 p-5 text-center">
      <h1 class="text-2xl font-bold">🇨🇳 Chinese Signals</h1>
      <p class="text-sm text-blue-100 mt-1">AI BOT PRO MAX</p>
    </div>

    <!-- Main -->
    <div class="p-5 space-y-4">

      <!-- Activation Key -->
      <div>
        <label class="block text-sm font-semibold mb-2">
          Activation Key
        </label>

        <input
          id="key"
          type="text"
          placeholder="Enter activation key"
          class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white outline-none focus:border-blue-500"
        />
      </div>

      <!-- Broker -->
      <div>
        <label class="block text-sm font-semibold mb-2">
          Broker
        </label>

        <select
          id="broker"
          class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white"
        >
          <option value="Quotex">Quotex</option>
          <option value="Pocket Option">Pocket Option</option>
          <option value="IQ Option">IQ Option</option>
          <option value="Olymp Trade">Olymp Trade</option>
        </select>
      </div>

      <!-- Market Type -->
      <div>
        <label class="block text-sm font-semibold mb-2">
          Market Type
        </label>

        <select
          id="marketType"
          class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white"
        >
          <option value="OTC Markets">OTC Markets</option>
          <option value="Live Currency Markets">Live Currency Markets</option>
          <option value="Crypto Markets">Crypto Markets</option>
          <option value="Commodities">Commodities</option>
          <option value="Indices & Stocks">Indices & Stocks</option>
        </select>
      </div>

      <!-- Trading Pair -->
      <div>
        <label class="block text-sm font-semibold mb-2">
          Trading Pair
        </label>

        <select
          id="pair"
          class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white"
        >
          <option>EUR/USD</option>
          <option>GBP/USD</option>
          <option>USD/JPY</option>
          <option>USD/CHF</option>
          <option>AUD/USD</option>
          <option>USD/CAD</option>
          <option>NZD/USD</option>
          <option>EUR/GBP</option>
          <option>EUR/JPY</option>
          <option>GBP/JPY</option>
        </select>
      </div>

      <!-- Timeframe -->
      <div>
        <label class="block text-sm font-semibold mb-2">
          Signal Timeframe
        </label>

        <select
          id="timerSelect"
          class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-white"
        >
          <option value="3">3 Seconds</option>
          <option value="5">5 Seconds</option>
          <option value="7">7 Seconds</option>
          <option value="10">10 Seconds</option>
          <option value="12">12 Seconds</option>
          <option value="15">15 Seconds</option>
          <option value="17">17 Seconds</option>
          <option value="20">20 Seconds</option>
          <option value="25">25 Seconds</option>
          <option value="30">30 Seconds</option>
          <option value="60">1 Minute</option>
          <option value="120">2 Minutes</option>
          <option value="180">3 Minutes</option>
          <option value="300">5 Minutes</option>
          <option value="600">10 Minutes</option>
          <option value="900">15 Minutes</option>
          <option value="1800">30 Minutes</option>
          <option value="3600">1 Hour</option>
        </select>
      </div>

      <!-- Generate Button -->
      <button
        id="generateBtn"
        onclick="generateSignal()"
        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-lg p-3 font-bold transition"
      >
        ⚡ GENERATE SIGNAL
      </button>

      <!-- Loading -->
      <div id="loading" class="hidden text-center py-6">
        <div class="w-12 h-12 border-4 border-slate-600 border-t-blue-500 rounded-full animate-spin-custom mx-auto"></div>
        <p class="mt-4 text-blue-300 font-semibold">
          AI is analyzing the market...
        </p>
      </div>

      <!-- Result -->
      <div id="result" class="hidden">

        <div class="bg-slate-800 rounded-xl p-5 border border-slate-700">

          <div class="text-center mb-4">
            <p class="text-xs text-slate-400">
              AI SIGNAL
            </p>

            <h2
              id="signal"
              class="text-4xl font-black mt-2"
            >
              CALL
            </h2>
          </div>

          <div class="grid grid-cols-2 gap-3">

            <div class="bg-slate-900 rounded-lg p-3 text-center">
              <p class="text-xs text-slate-400">
                Pair
              </p>

              <p
                id="resultPair"
                class="font-bold mt-1"
              >
                EUR/USD
              </p>
            </div>

            <div class="bg-slate-900 rounded-lg p-3 text-center">
              <p class="text-xs text-slate-400">
                Time
              </p>

              <p
                id="resultTime"
                class="font-bold mt-1"
              >
                5 Seconds
              </p>
            </div>

          </div>

          <div class="mt-3 bg-slate-900 rounded-lg p-3 text-center">

            <p class="text-xs text-slate-400">
              AI Accuracy
            </p>

            <p
              id="accuracy"
              class="text-xl font-bold text-green-400 mt-1"
            >
              98.8%
            </p>

          </div>

          <div class="mt-4 text-center">

            <p class="text-xs text-slate-500">
              Generated Signal
            </p>

            <p
              id="signalTime"
              class="text-sm text-slate-300 mt-1"
            >
              --
            </p>

          </div>

        </div>

      </div>

    </div>
  </div>

  <script>
    const ACTIVATION_KEY = "AWRSK78";

    function generateSignal() {

      const key = document.getElementById("key").value.trim();

      if (key !== ACTIVATION_KEY) {
        alert("Invalid Activation Key");
        return;
      }

      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const button = document.getElementById("generateBtn");

      loading.classList.remove("hidden");
      result.classList.add("hidden");
      button.disabled = true;

      setTimeout(() => {

        const pair =
          document.getElementById("pair").value;

        const selectedTimer =
          parseInt(document.getElementById("timerSelect").value);

        const signal =
          Math.random() > 0.5 ? "CALL" : "PUT";

        const accuracy =
          (94.5 + Math.random() * 4.8).toFixed(1);

        let timeName;

        if (selectedTimer < 60) {
          timeName = selectedTimer + " Seconds";
        } else {
          const minutes = selectedTimer / 60;
          timeName =
            minutes === 1
              ? "1 Minute"
              : minutes + " Minutes";
        }

        document.getElementById("signal").textContent = signal;
        document.getElementById("resultPair").textContent = pair;
        document.getElementById("resultTime").textContent = timeName;
        document.getElementById("accuracy").textContent =
          accuracy + "%";

        document.getElementById("signalTime").textContent =
          new Date().toLocaleTimeString();

        loading.classList.add("hidden");
        result.classList.remove("hidden");
        button.disabled = false;

      }, 1200);
    }
  </script>

</body>
</html>
