<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Market Analysis Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 10px 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }
    h1 {
      font-size: 1.2rem;
      color: #58a6ff;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 15px;
      height: calc(100vh - 85px);
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 10px 15px;
      background: #21262d;
      font-weight: bold;
      font-size: 0.9rem;
      border-bottom: 1px solid #30363d;
    }
    .widget-container {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      .panel {
        height: 500px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>TradingView Real-Time Market Analysis</h1>
    <span style="font-size: 0.8rem; color: #8b949e;">Official Live Data Feed</span>
  </header>

  <div class="grid-container">
    
    <!-- Left Side: Live Interactive Chart -->
    <div class="panel">
      <div class="panel-header">Interactive Technical Chart (1-Min Timeframe)</div>
      <div class="widget-container" id="chart_widget">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
          {
            "autosize": true,
            "symbol": "FX:EURUSD",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "allow_symbol_change": true,
            "calendar": false,
            "support_host": "https://www.tradingview.com"
          }
          </script>
        </div>
      </div>
    </div>

    <!-- Right Side: Real Technical Summary Gauge -->
    <div class="panel">
      <div class="panel-header">Real-Time Technical Indicator Analysis</div>
      <div class="widget-container">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
          {
            "interval": "1m",
            "width": "100%",
            "isTransparent": true,
            "height": "100%",
            "symbol": "FX:EURUSD",
            "showIntervalTabs": true,
            "displayMode": "single",
            "locale": "en",
            "colorTheme": "dark"
          }
          </script>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
