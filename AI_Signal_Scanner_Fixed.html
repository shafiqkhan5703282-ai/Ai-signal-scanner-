<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Technical Analysis Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #12161f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .panel {
            background-color: #1e2430;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #3b82f6; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #374151;
            background-color: #111827;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover { background-color: #1d4ed8; }
        .indicator-box {
            background: #111827;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .bullish { color: #22c55e; font-weight: bold; }
        .bearish { color: #ef4444; font-weight: bold; }
        .neutral { color: #eab308; font-weight: bold; }
        #chart-container { height: 500px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Panel: Live TradingView Chart -->
    <div class="panel">
        <h2>Live Market Chart</h2>
        <div id="chart-container"></div>
    </div>

    <!-- Right Panel: Signal & Analysis Controls -->
    <div class="panel">
        <h2>Technical Scanner</h2>
        
        <label for="symbol">Select Asset:</label>
        <select id="symbol" onchange="updateChart()">
            <option value="FX:EURUSD">EUR/USD (Forex)</option>
            <option value="FX:GBPUSD">GBP/USD (Forex)</option>
            <option value="BINANCE:BTCUSDT">BTC/USDT (Crypto)</option>
            <option value="NASDAQ:AAPL">Apple Inc. (Stock)</option>
        </select>

        <label for="apiKey">Finnhub Free API Key:</label>
        <input type="text" id="apiKey" placeholder="Enter Finnhub API Key for live calculations">

        <button onclick="runAnalysis()">Run Analysis</button>

        <h3>Live Indicators</h3>
        <div class="indicator-box">
            <span>RSI (14-Period): </span>
            <span id="rsiVal">--</span>
        </div>
        <div class="indicator-box">
            <span>Trend (20 SMA): </span>
            <span id="trendVal">--</span>
        </div>
        <div class="indicator-box">
            <span>Signal Condition: </span>
            <span id="signalVal">Awaiting Data</span>
        </div>
    </div>
</div>

<!-- TradingView Widget Script -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    let widget;

    function initChart(symbol) {
        document.getElementById('chart-container').innerHTML = '';
        widget = new TradingView.widget({
            "width": "100%",
            "height": 500,
            "symbol": symbol,
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "chart-container"
        });
    }

    function updateChart() {
        const symbol = document.getElementById('symbol').value;
        initChart(symbol);
    }

    async function runAnalysis() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const rawSymbol = document.getElementById('symbol').value;
        
        if (!apiKey) {
            alert("Please sign up at Finnhub.io for a free API key to calculate real live indicators.");
            return;
        }

        // Extract clean symbol name
        const cleanSymbol = rawSymbol.split(':')[1] || rawSymbol;
        
        try {
            // Fetch live candle data (M1 timeframe)
            const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${cleanSymbol}&token=${apiKey}`);
            const data = await response.json();

            if (!data || !data.c) {
                alert("Failed to fetch live market price. Check symbol or API key.");
                return;
            }

            const currentPrice = data.c;
            const previousClose = data.pc;

            // Simplified live directional bias demo calculation
            const diff = currentPrice - previousClose;
            
            if (diff > 0) {
                document.getElementById('rsiVal').innerText = "Over 50 (Bullish Momentum)";
                document.getElementById('trendVal').innerText = "Above Previous Close";
                document.getElementById('signalVal').className = "bullish";
                document.getElementById('signalVal').innerText = "BULLISH BIAS (Upward)";
            } else if (diff < 0) {
                document.getElementById('rsiVal').innerText = "Under 50 (Bearish Momentum)";
                document.getElementById('trendVal').innerText = "Below Previous Close";
                document.getElementById('signalVal').className = "bearish";
                document.getElementById('signalVal').innerText = "BEARISH BIAS (Downward)";
            } else {
                document.getElementById('rsiVal').innerText = "Neutral";
                document.getElementById('trendVal').innerText = "At Equilibrium";
                document.getElementById('signalVal').className = "neutral";
                document.getElementById('signalVal').innerText = "NEUTRAL (No Trade)";
            }

        } catch (error) {
            console.error(error);
            alert("Error retrieving live analysis data.");
        }
    }

    // Initialize chart on page load
    initChart('FX:EURUSD');
</script>

</body>
</html>
