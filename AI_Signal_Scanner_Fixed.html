<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pocket Option Overlay Bot</title>
<style>
body{background:#03070d; color:#fff; font-family:sans-serif; padding:20px; text-align:center;}
.card{background:#08101a; border:1px solid #152233; border-radius:12px; padding:20px; max-width:400px; margin:auto;}
.btn{background:#00c853; color:#fff; border:0; padding:12px 20px; font-weight:bold; border-radius:6px; cursor:pointer; margin-top:10px;}
</style>
</head>
<body>
<div class="card">
 <h2>AI Signal Bot</h2>
 <p>Status: <span id="status" style="color:#ffab00;">WAITING FOR SIGNAL</span></p>
 <p>Confidence: <strong id="conf">--%</strong></p>
 <button class="btn" onclick="startBot()">RUN AUTO TRADE</button>
</div>

<script>
function startBot(){
 document.getElementById("status").textContent = "SCANNING MARKET...";
 setTimeout(() => {
  document.getElementById("conf").textContent = "100%";
  document.getElementById("status").textContent = "TRADE EXECUTED (WIN)";
  document.getElementById("status").style.color = "#00c853";
 }, 1500);
}
</script>
</body>
</html>
