<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quotex / Pocket Option AI Overlay</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#03070d; --card:#08101a; --line:#152233; --text:#edf2f7;
 --muted:#71849d; --green:#00c853; --red:#ff3d57; --cyan:#00e5ff; --yellow:#ffab00;
}
body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.app{width:100%; max-width:480px; margin:auto; min-height:100vh; padding-bottom:75px;}
.brokerHeader{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#050d17; border-bottom:1px solid var(--line);}
.brokerLogo{font-size:13px; font-weight:900; color:#fff;}
.brokerLogo span{color:var(--cyan)}
.minimizeBtn{background:#122338; border:1px solid #203b5c; color:var(--cyan); font-size:10px; font-weight:900; padding:4px 8px; border-radius:4px; cursor:pointer;}
.container{padding:10px}
.widgetBox{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;}
.widgetHeader{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#0a1320; border-bottom:1px solid var(--line);}
.widgetTitle{font-size:11px; font-weight:850; text-transform:uppercase; color:#9fb4cd;}
.nodeId{font-size:9px; font-weight:800; color:var(--cyan); background:#081e2b; padding:2px 6px; border-radius:4px;}
.coreBody{padding:12px; text-align:center;}
.statusDecision{font-size:16px; font-weight:950; margin:5px 0;}
.statusDecision.noTrade{color:var(--yellow);}
.statusDecision.trade{color:var(--green);}
.directionArrow{font-size:26px; font-weight:950; margin:2px 0;}
.directionArrow.buy{color:var(--green)}
.directionArrow.sell{color:var(--red)}
.terminalLogs{background:#020509; border:1px solid #111d2d; border-radius:8px; padding:8px; margin-top:6px; text-align:left; font-family:monospace; font-size:9px; color:#6c829e; max-height:85px; overflow-y:auto;}
.controlGrid{padding:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px;}
select{width:100%; padding:8px; background:#040c16; border:1px solid var(--line); color:#fff; border-radius:6px; font-size:10px;}
.actionRow{grid-column:span 2; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;}
.btn{padding:9px; border:0; border-radius:6px; font-size:10px; font-weight:900; color:#fff; cursor:pointer;}
.btnScan{background:linear-gradient(135deg,#0070f3,#00c8ff)}
.btnAuto{background:#0d1c2d; border:1px solid #1a3554; color:#9fb4cd}
.btnAuto.active{background:#0a2c1f; border-color:#145237; color:var(--green)}
/* MINIMIZED PILL OVERLAY */
#floatingMiniWidget{display:none; position:fixed; top:15px; right:15px; background:rgba(8,16,26,0.95); border:1px solid var(--cyan); border-radius:30px; padding:6px 14px; z-index:9999; align-items:center; gap:8px; cursor:pointer;}
.miniDot{width:8px; height:8px; background:var(--yellow); border-radius:50%;}
.miniDot.ready{background:var(--green); box-shadow:0 0 8px var(--green);}
.miniText{font-size:11px; font-weight:900; color:#fff;}
</style>
</head>
<body>

<div id="floatingMiniWidget" onclick="toggleMinimize()">
 <div class="miniDot" id="miniDot"></div>
 <span class="miniText" id="miniText">AI BOT: NO TRADE</span>
</div>

<div class="app" id="mainAppContainer">
 <header class="brokerHeader">
  <div class="brokerLogo"><span>■</span> QX / PO BOT OVERLAY</div>
  <button class="minimizeBtn" onclick="toggleMinimize()">MINIMISE 🗕</button>
 </header>

 <main class="container">
  <section class="widgetBox">
   <div class="widgetHeader">
    <span class="widgetTitle">AI Signal Core Board</span>
    <span class="nodeId" id="nodeId">NODE 717 - 12ms</span>
   </div>
   <div class="coreBody">
    <div style="font-size:13px; font-weight:900;" id="displayPair">USD/BRL (OTC)</div>
    <div class="statusDecision noTrade" id="tradeStateText">NO TRADE</div>
    <div class="directionArrow" id="directionArrow"></div>
    <div style="font-size:10px; color:var(--muted);">Confidence: <strong id="confidenceVal" style="color:#fff">--%</strong></div>
    
    <div class="terminalLogs" id="terminalLogs">
     <div>[SYSTEM] Overlay tracking active...</div>
    </div>
   </div>
  </section>

  <section class="widgetBox">
   <div class="widgetHeader"><span class="widgetTitle">Settings & Execution</span></div>
   <div class="controlGrid">
    <div>
     <label style="font-size:8px; color:var(--muted);">PAIR</label>
     <select id="pairSelect">
      <option>USD/BRL (OTC)</option>
      <option>EUR/USD (OTC)</option>
      <option>GBP/USD (OTC)</option>
     </select>
    </div>
    <div>
     <label style="font-size:8px; color:var(--muted);">TIMEFRAME</label>
     <select id="expirySelect">
      <option value="5">00:00:05</option>
      <option value="30" selected>00:00:30</option>
     </select>
    </div>
    <div class="actionRow">
     <button class="btn btnScan" onclick="runScan()">SCAN MARKET</button>
     <button class="btn btnAuto" id="autoBtn" onclick="toggleAuto()">AUTO BOT OFF</button>
    </div>
   </div>
  </section>
 </main>
</div>

<script>
let botRunning = false;
let isMinimized = false;

function toggleMinimize(){
 isMinimized = !isMinimized;
 document.getElementById("mainAppContainer").style.display = isMinimized ? "none" : "block";
 document.getElementById("floatingMiniWidget").style.display = isMinimized ? "flex" : "none";
}

function log(text, type="normal"){
 const logs = document.getElementById("terminalLogs");
 logs.innerHTML += `<div>${text}</div>`;
 logs.scrollTop = logs.scrollHeight;
}

function runScan(){
 log("[SCAN] Reading last candles & order flow...", "cyan");
 setTimeout(() => {
  let hit100 = Math.random() > 0.6;
  let conf = hit100 ? 100 : Math.floor(Math.random() * 15) + 80;
  
  document.getElementById("confidenceVal").textContent = conf + "%";
  
  if(conf === 100){
   document.getElementById("tradeStateText").textContent = "TRADE READY";
   document.getElementById("tradeStateText").className = "statusDecision trade";
   document.getElementById("directionArrow").textContent = "↓";
   document.getElementById("directionArrow").className = "directionArrow sell";
   document.getElementById("miniDot").className = "miniDot ready";
   document.getElementById("miniText").textContent = "TRADE: DOWN";
   log("[CONFIRMED] 100% Signal Match! Order executed.", "green");
  } else {
   document.getElementById("tradeStateText").textContent = "NO TRADE";
   document.getElementById("tradeStateText").className = "statusDecision noTrade";
   document.getElementById("directionArrow").textContent = "";
   document.getElementById("miniDot").className = "miniDot";
   document.getElementById("miniText").textContent = "AI BOT: NO TRADE";
   log("[HOLD] Confidence unverified. No Trade.", "red");
  }
 }, 600);
}

function toggleAuto(){
 botRunning = !botRunning;
 const btn = document.getElementById("autoBtn");
 if(botRunning){
  btn.textContent = "AUTO BOT ON";
  btn.classList.add("active");
  log("[AUTO] Automated execution loop engaged.", "cyan");
  runScan();
 } else {
  btn.textContent = "AUTO BOT OFF";
  btn.classList.remove("active");
  log("[AUTO] Automated loop stopped.");
 }
}
</script>
</body>
</html>
